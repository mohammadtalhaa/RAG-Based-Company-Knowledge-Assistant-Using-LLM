<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Mr Avayo – AI Assistant</title>

    <!-- Markdown & code highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ──────────────────────────────────────────────────────────────
                   CSS VARIABLES
                ────────────────────────────────────────────────────────────── */
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #161616;
            --bg-surface: #1e1e1e;
            --bg-surface-2: #2a2a2a;
            --bg-surface-3: #333333;
            --bg-bubble-user: #c62828;
            --bg-bubble-user-hover: #d32f2f;
            --bg-bubble-assistant: #1e1e1e;

            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;

            --border-light: #2c2c2c;
            --border-medium: #3a3a3a;

            --accent: #c62828;
            --accent-hover: #b71c1c;
            --accent-glow: rgba(198, 40, 40, 0.25);

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 16px 64px rgba(0, 0, 0, 0.7);

            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 9999px;

            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'SF Mono', 'Menlo', 'Consolas', monospace;

            --sidebar-width: 300px;
            --sidebar-collapsed: 0px;
            --header-height: 64px;
            --input-height: 72px;
            --transition-speed: 0.3s;
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ──────────────────────────────────────────────────────────────
                   RESET & BASE
                ────────────────────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* ──────────────────────────────────────────────────────────────
                   SCROLLBAR
                ────────────────────────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: var(--radius-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ──────────────────────────────────────────────────────────────
                   SIDEBAR
                ────────────────────────────────────────────────────────────── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 998;
            opacity: 0;
            transition: opacity var(--transition-speed) ease;
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            z-index: 999;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
            transform: translateX(0);
            transition: transform var(--transition-speed) var(--transition-bounce);
            box-shadow: var(--shadow-md);
        }

        .sidebar.collapsed {
            transform: translateX(calc(-1 * var(--sidebar-width)));
        }

        /* Sidebar header */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            min-height: var(--header-height);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .sidebar-brand .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar-brand .logo-text {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .sidebar-brand .logo-text span {
            font-weight: 400;
            font-size: 0.65rem;
            color: var(--text-secondary);
            background: var(--bg-surface-2);
            padding: 0.05rem 0.6rem;
            border-radius: var(--radius-full);
            margin-left: 0.3rem;
            vertical-align: middle;
        }
        .sidebar-close {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: var(--radius-sm);
            transition: background var(--transition-speed);
        }
        .sidebar-close:hover {
            background: var(--bg-surface-2);
        }

        /* Sidebar body (scrollable) */
        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.25rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: var(--bg-surface-2);
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
            border-radius: var(--radius-lg);
            padding: 0.65rem 1.2rem;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition-speed);
            width: 100%;
        }
        .new-chat-btn:hover {
            background: var(--bg-surface-3);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .new-chat-btn:active {
            transform: scale(0.97);
        }

        .section-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 0.25rem;
        }

        /* File list */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0.6rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            color: var(--text-primary);
            transition: background var(--transition-speed);
            cursor: default;
        }
        .file-item:hover {
            background: var(--bg-surface-2);
        }
        .file-item .icon {
            font-size: 1rem;
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }
        .file-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.82rem;
        }
        .file-item .status {
            font-size: 0.7rem;
            color: #4caf50;
            flex-shrink: 0;
        }
        .file-item .delete-file {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.1rem 0.3rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            transition: all var(--transition-speed);
            opacity: 0;
        }
        .file-item:hover .delete-file {
            opacity: 1;
        }
        .file-item .delete-file:hover {
            color: #ef5350;
            background: rgba(239, 83, 80, 0.15);
        }
        .file-empty {
            color: var(--text-muted);
            font-size: 0.82rem;
            padding: 0.5rem 0;
            text-align: center;
        }

        /* Upload area */
        .upload-area {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }
        .upload-area .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .upload-area .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            font-size: 0;
        }
        .upload-area .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--bg-surface-2);
            border: 1px dashed var(--border-medium);
            border-radius: var(--radius-md);
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all var(--transition-speed);
            cursor: pointer;
            width: 100%;
        }
        .upload-area .file-input-label:hover {
            border-color: var(--accent);
            background: var(--bg-surface-3);
        }
        .upload-area .file-input-label .file-count {
            background: var(--bg-surface-3);
            padding: 0.05rem 0.6rem;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .upload-area .upload-actions {
            display: flex;
            gap: 0.5rem;
        }
        .upload-area .upload-actions button {
            flex: 1;
            padding: 0.55rem 1rem;
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-speed);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-primary:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-surface-2);
            color: var(--text-primary);
            border: 1px solid var(--border-medium) !important;
        }
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-surface-3);
            border-color: var(--text-muted) !important;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-light);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .sidebar-footer .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4caf50;
            margin-right: 0.4rem;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ──────────────────────────────────────────────────────────────
                   MAIN CHAT AREA
                ────────────────────────────────────────────────────────────── */
        .chat-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100dvh;
            margin-left: var(--sidebar-width);
            transition: margin-left var(--transition-speed) var(--transition-bounce);
            background: var(--bg-primary);
            position: relative;
        }
        .chat-wrapper.expanded {
            margin-left: 0;
        }

        /* Chat header */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            height: var(--header-height);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            background: var(--bg-secondary);
            gap: 0.75rem;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }
        .hamburger {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            transition: background var(--transition-speed);
        }
        .hamburger:hover {
            background: var(--bg-surface-2);
        }

        .chat-header-title {
            font-size: 1.05rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-header-title small {
            font-weight: 400;
            font-size: 0.6rem;
            color: var(--text-secondary);
            background: var(--bg-surface-2);
            padding: 0.05rem 0.6rem;
            border-radius: var(--radius-full);
            margin-left: 0.3rem;
            vertical-align: middle;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .session-badge {
            font-size: 0.65rem;
            color: var(--text-secondary);
            background: var(--bg-surface-2);
            padding: 0.2rem 0.8rem;
            border-radius: var(--radius-full);
            font-family: var(--font-mono);
            letter-spacing: 0.3px;
            border: 1px solid var(--border-light);
        }
        .header-action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            transition: all var(--transition-speed);
        }
        .header-action-btn:hover {
            background: var(--bg-surface-2);
            color: var(--text-primary);
        }

        /* Messages container */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1.25rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            scroll-behavior: smooth;
        }

        /* Individual message */
        .message {
            display: flex;
            animation: messageIn 0.35s ease both;
            max-width: 92%;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.assistant {
            align-self: flex-start;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Avatar */
        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 4px;
            user-select: none;
        }
        .message.user .msg-avatar {
            background: var(--bg-bubble-user);
            color: #fff;
            margin-right: 0;
            margin-left: 0.6rem;
        }
        .message.assistant .msg-avatar {
            background: var(--bg-surface-3);
            color: var(--text-primary);
            margin-right: 0.6rem;
            margin-left: 0;
            border: 1px solid var(--border-medium);
        }

        .msg-content {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 0;
            flex: 1;
        }
        .msg-bubble {
            padding: 0.7rem 1rem;
            border-radius: var(--radius-md);
            line-height: 1.6;
            font-size: 0.92rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .message.user .msg-bubble {
            background: var(--bg-bubble-user);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .msg-bubble {
            background: var(--bg-bubble-assistant);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 0.6rem;
            color: var(--text-muted);
            padding: 0 0.3rem;
            opacity: 0.7;
            margin-top: 0.1rem;
        }
        .message.user .msg-time {
            text-align: right;
            padding-right: 0.6rem;
        }
        .message.assistant .msg-time {
            padding-left: 0.6rem;
        }

        /* Sources */
        .sources {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }
        .source-badge {
            background: var(--bg-surface-2);
            border-radius: var(--radius-full);
            padding: 0.1rem 0.7rem;
            font-size: 0.65rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .source-badge i {
            font-size: 0.55rem;
            opacity: 0.7;
        }

        /* Thinking indicator */
        .thinking-wrapper {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.2rem;
        }
        .thinking-wrapper .dots {
            display: flex;
            gap: 0.2rem;
        }
        .thinking-wrapper .dots span {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: dotBounce 1.4s infinite ease-in-out both;
        }
        .thinking-wrapper .dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        .thinking-wrapper .dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        .thinking-wrapper .dots span:nth-child(3) {
            animation-delay: 0s;
        }
        @keyframes dotBounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .thinking-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ─── MARKDOWN STYLES ──────────────────────────────────────── */
        .msg-bubble pre {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 0.8rem;
            overflow-x: auto;
            margin: 0.5rem 0;
            border: 1px solid var(--border-light);
        }
        .msg-bubble code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: var(--bg-surface-2);
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
        }
        .msg-bubble pre code {
            background: transparent;
            padding: 0;
            font-size: 0.85em;
        }
        .msg-bubble ul,
        .msg-bubble ol {
            padding-left: 1.5rem;
            margin: 0.4rem 0;
        }
        .msg-bubble p {
            margin: 0.4rem 0;
        }
        .msg-bubble p:first-child {
            margin-top: 0;
        }
        .msg-bubble p:last-child {
            margin-bottom: 0;
        }
        .msg-bubble blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 0.8rem;
            margin: 0.4rem 0;
            color: var(--text-secondary);
        }
        .msg-bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.4rem 0;
            font-size: 0.85em;
        }
        .msg-bubble th,
        .msg-bubble td {
            border: 1px solid var(--border-medium);
            padding: 0.3rem 0.6rem;
            text-align: left;
        }
        .msg-bubble th {
            background: var(--bg-surface-2);
        }
        .msg-bubble a {
            color: var(--accent);
            text-decoration: none;
        }
        .msg-bubble a:hover {
            text-decoration: underline;
        }

        /* ─── INPUT AREA ───────────────────────────────────────────── */
        .input-area {
            padding: 0.75rem 1.25rem 1rem;
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
            background: var(--bg-secondary);
            display: flex;
            gap: 0.6rem;
            align-items: flex-end;
        }
        .input-area .input-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            background: var(--bg-surface);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-lg);
            transition: all var(--transition-speed);
            padding: 0.1rem 0.1rem 0.1rem 1rem;
        }
        .input-area .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .input-area .input-wrap textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: var(--font);
            padding: 0.6rem 0;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
        }
        .input-area .input-wrap textarea::placeholder {
            color: var(--text-muted);
        }
        .input-area .input-wrap textarea::-webkit-scrollbar {
            width: 3px;
        }

        .input-area .send-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.1rem 0.1rem 0.1rem 0.3rem;
        }
        .input-area .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: scale(1.04);
        }
        .input-area .send-btn:active:not(:disabled) {
            transform: scale(0.92);
        }
        .input-area .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ─── TOAST NOTIFICATIONS ──────────────────────────────────── */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 360px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            padding: 0.8rem 1.2rem;
            border-radius: var(--radius-md);
            background: var(--bg-surface);
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            animation: toastIn 0.4s ease both;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            background: rgba(30, 30, 30, 0.92);
        }
        .toast.success {
            border-left: 3px solid #4caf50;
        }
        .toast.error {
            border-left: 3px solid #ef5350;
        }
        .toast.info {
            border-left: 3px solid var(--accent);
        }
        .toast .toast-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .toast .toast-body {
            flex: 1;
            font-size: 0.9rem;
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.1rem 0.2rem;
            border-radius: var(--radius-sm);
            transition: background var(--transition-speed);
        }
        .toast .toast-close:hover {
            background: var(--bg-surface-2);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(40px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        .toast.out {
            animation: toastOut 0.3s ease both;
        }
        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateX(40px) scale(0.92);
            }
        }

        /* ──────────────────────────────────────────────────────────────
                   RESPONSIVE BREAKPOINTS
                ────────────────────────────────────────────────────────────── */

        /* Tablets & small laptops */
        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 280px;
            }
            .chat-wrapper {
                margin-left: var(--sidebar-width);
            }
        }

        /* Mobile devices */
        @media (max-width: 820px) {
            :root {
                --sidebar-width: 300px;
                --header-height: 56px;
                --input-height: 64px;
            }

            .sidebar {
                width: var(--sidebar-width);
                transform: translateX(calc(-1 * var(--sidebar-width)));
                border-right: none;
                border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
                box-shadow: var(--shadow-lg);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-close {
                display: block;
            }

            .sidebar-overlay.active {
                display: block;
            }

            .chat-wrapper {
                margin-left: 0 !important;
            }

            .hamburger {
                display: block;
            }

            .chat-header {
                padding: 0 0.75rem;
            }
            .chat-header-title {
                font-size: 0.95rem;
            }
            .session-badge {
                font-size: 0.55rem;
                padding: 0.15rem 0.6rem;
            }
            .header-action-btn {
                font-size: 0.9rem;
                padding: 0.2rem 0.4rem;
            }

            .messages {
                padding: 0.75rem 0.75rem 0.25rem;
                gap: 0.6rem;
            }
            .message {
                max-width: 96%;
            }
            .msg-bubble {
                font-size: 0.88rem;
                padding: 0.6rem 0.85rem;
            }
            .msg-avatar {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
            .message.user .msg-avatar {
                margin-left: 0.4rem;
            }
            .message.assistant .msg-avatar {
                margin-right: 0.4rem;
            }

            .input-area {
                padding: 0.5rem 0.75rem 0.75rem;
                gap: 0.4rem;
            }
            .input-area .input-wrap {
                padding: 0.1rem 0.1rem 0.1rem 0.75rem;
                border-radius: var(--radius-lg);
            }
            .input-area .input-wrap textarea {
                font-size: 0.9rem;
                min-height: 38px;
                padding: 0.4rem 0;
            }
            .input-area .send-btn {
                width: 38px;
                height: 38px;
                font-size: 0.95rem;
            }

            .toast-container {
                bottom: 1rem;
                right: 1rem;
                max-width: 300px;
            }
            .toast {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }

            .sidebar-body {
                padding: 0.75rem 1rem 1rem;
                gap: 0.75rem;
            }
            .sidebar-header {
                padding: 0.75rem 1rem;
                min-height: var(--header-height);
            }
            .sidebar-brand .logo-icon {
                width: 32px;
                height: 32px;
                font-size: 1rem;
            }
            .sidebar-brand .logo-text {
                font-size: 1.05rem;
            }

            .file-list {
                max-height: 120px;
            }
            .file-item {
                padding: 0.35rem 0.5rem;
                font-size: 0.8rem;
            }
        }

        /* Small phones */
        @media (max-width: 420px) {
            :root {
                --sidebar-width: 280px;
            }
            .chat-header-title {
                font-size: 0.85rem;
            }
            .chat-header-title small {
                display: none;
            }
            .msg-bubble {
                font-size: 0.84rem;
                padding: 0.5rem 0.7rem;
            }
            .input-area .input-wrap textarea {
                font-size: 0.85rem;
                min-height: 34px;
            }
            .input-area .send-btn {
                width: 34px;
                height: 34px;
                font-size: 0.85rem;
            }
            .session-badge {
                font-size: 0.5rem;
                padding: 0.1rem 0.5rem;
            }
            .toast-container {
                max-width: 260px;
                bottom: 0.75rem;
                right: 0.75rem;
            }
            .toast {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }
        }

        /* Landscape phones */
        @media (max-width: 820px) and (orientation: landscape) {
            .sidebar {
                max-height: 100dvh;
            }
            .messages {
                padding: 0.5rem 0.75rem 0.25rem;
                gap: 0.4rem;
            }
            .msg-bubble {
                font-size: 0.82rem;
                padding: 0.4rem 0.7rem;
            }
            .msg-avatar {
                width: 24px;
                height: 24px;
                font-size: 0.6rem;
            }
            .input-area {
                padding: 0.3rem 0.75rem 0.5rem;
            }
            .input-area .input-wrap textarea {
                min-height: 30px;
                padding: 0.3rem 0;
                font-size: 0.82rem;
            }
            .input-area .send-btn {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }
            .file-list {
                max-height: 80px;
            }
            .sidebar-body {
                padding: 0.5rem 0.75rem 0.75rem;
                gap: 0.5rem;
            }
        }

        /* ─── UTILITY ──────────────────────────────────────────────── */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .gap-1 {
            gap: 0.5rem;
        }
        .flex {
            display: flex;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- ─── SIDEBAR OVERLAY ──────────────────────────────────────── -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ─── SIDEBAR ────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
        <!-- Header -->
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="logo-icon">✦</div>
                <div class="logo-text">Avayo <span>BETA</span></div>
            </div>
            <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="sidebar-body">
            <button class="new-chat-btn" id="newChatBtn">
                <i class="fas fa-plus-circle"></i> New Chat
            </button>

            <div class="section-label"><i class="fas fa-folder-open"></i> Knowledge Base</div>
            <div class="file-list" id="fileList">
                <div class="file-empty"><i class="fas fa-spinner fa-pulse"></i> Loading...</div>
            </div>

            <div class="upload-area">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,.csv,.md" />
                    <div class="file-input-label" id="fileInputLabel">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Choose files</span>
                        <span class="file-count" id="fileCount">0</span>
                    </div>
                </div>
                <div class="upload-actions">
                    <button class="btn-primary" id="uploadBtn">
                        <i class="fas fa-upload"></i> Index
                    </button>
                    <button class="btn-secondary" id="checkSystemBtn" title="Check system status">
                        <i class="fas fa-heartbeat"></i>
                    </button>
                </div>
            </div>

            <div class="sidebar-footer">
                <span><span class="status-dot"></span> RAG · Gemini</span>
                <span id="chunkCount">0 chunks</span>
            </div>
        </div>
    </aside>

    <!-- ─── CHAT WRAPPER ───────────────────────────────────────────── -->
    <div class="chat-wrapper" id="chatWrapper">

        <!-- Header -->
        <header class="chat-header">
            <div class="chat-header-left">
                <button class="hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="chat-header-title">
                    Mr Avayo <small>BETA</small>
                </div>
            </div>
            <div class="chat-header-right">
                <span class="session-badge" id="sessionId">⚡</span>
                <button class="header-action-btn" id="clearChatBtn" title="Clear chat" aria-label="Clear chat">
                    <i class="fas fa-eraser"></i>
                </button>
            </div>
        </header>

        <!-- Messages -->
        <div class="messages" id="messageContainer">
            <!-- Injected by JS -->
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-wrap">
                <textarea id="userInput" rows="1" placeholder="Ask a question..." aria-label="Message input"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" aria-label="Send message">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- ─── TOAST CONTAINER ────────────────────────────────────────── -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ─── CONFIG ──────────────────────────────────────────────────
            const BACKEND = 'https://mohammadtalhaa-fvltesting.hf.space';

            // ─── DOM REFS ──────────────────────────────────────────────
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const sidebarClose = document.getElementById('sidebarClose');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const messageContainer = document.getElementById('messageContainer');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const fileListDiv = document.getElementById('fileList');
            const fileInput = document.getElementById('fileInput');
            const fileInputLabel = document.getElementById('fileInputLabel');
            const fileCount = document.getElementById('fileCount');
            const uploadBtn = document.getElementById('uploadBtn');
            const checkSystemBtn = document.getElementById('checkSystemBtn');
            const newChatBtn = document.getElementById('newChatBtn');
            const clearChatBtn = document.getElementById('clearChatBtn');
            const sessionIdSpan = document.getElementById('sessionId');
            const chunkCountSpan = document.getElementById('chunkCount');
            const toastContainer = document.getElementById('toastContainer');

            // ─── STATE ──────────────────────────────────────────────────
            let sessionId = crypto.randomUUID ? crypto.randomUUID() : 's-' + Date.now();
            sessionIdSpan.textContent = sessionId.slice(0, 8);
            let messages = [];
            let isProcessing = false;
            let selectedFiles = [];

            // ─── SIDEBAR TOGGLE ────────────────────────────────────────
            function openSidebar() {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (sidebar.classList.contains('open')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            }

            hamburgerBtn.addEventListener('click', toggleSidebar);
            sidebarClose.addEventListener('click', closeSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);

            // Close sidebar on Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            // ─── TOAST SYSTEM ──────────────────────────────────────────
            function showToast(message, type = 'info', duration = 4000) {
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    info: 'fa-info-circle'
                };
                const colors = {
                    success: '#4caf50',
                    error: '#ef5350',
                    info: 'var(--accent)'
                };
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                        <span class="toast-icon" style="color:${colors[type]}"><i class="fas ${icons[type]}"></i></span>
                        <span class="toast-body">${message}</span>
                        <button class="toast-close" aria-label="Dismiss"><i class="fas fa-times"></i></button>
                    `;
                toastContainer.appendChild(toast);

                const close = () => {
                    toast.classList.add('out');
                    setTimeout(() => toast.remove(), 300);
                };
                toast.querySelector('.toast-close').addEventListener('click', close);
                setTimeout(close, duration);
                return toast;
            }

            // ─── MARKDOWN RENDERER ────────────────────────────────────
            function renderMarkdown(text) {
                try {
                    return marked.parse(text, {
                        highlight: function(code, lang) {
                            if (lang && hljs.getLanguage(lang)) {
                                return hljs.highlight(code, { language: lang }).value;
                            }
                            return hljs.highlightAuto(code).value;
                        },
                        breaks: true,
                        gfm: true
                    });
                } catch (_) {
                    return text;
                }
            }

            // ─── MESSAGE RENDER ────────────────────────────────────────
            function addMessage(role, content, sources = [], timestamp = null) {
                const time = timestamp || new Date();
                const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${role}`;

                // Avatar
                const avatar = document.createElement('div');
                avatar.className = 'msg-avatar';
                avatar.textContent = role === 'user' ? 'U' : 'A';
                msgDiv.appendChild(avatar);

                // Content wrapper
                const contentWrap = document.createElement('div');
                contentWrap.className = 'msg-content';

                // Bubble
                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble';

                if (role === 'assistant') {
                    bubble.innerHTML = renderMarkdown(content);
                    if (sources && sources.length) {
                        const srcDiv = document.createElement('div');
                        srcDiv.className = 'sources';
                        sources.forEach(src => {
                            const badge = document.createElement('span');
                            badge.className = 'source-badge';
                            badge.innerHTML = `<i class="fas fa-file-alt"></i> ${src}`;
                            srcDiv.appendChild(badge);
                        });
                        bubble.appendChild(srcDiv);
                    }
                } else {
                    bubble.textContent = content;
                }

                contentWrap.appendChild(bubble);

                // Timestamp
                const timeEl = document.createElement('div');
                timeEl.className = 'msg-time';
                timeEl.textContent = timeStr;
                contentWrap.appendChild(timeEl);

                msgDiv.appendChild(contentWrap);
                messageContainer.appendChild(msgDiv);
                messageContainer.scrollTop = messageContainer.scrollHeight;

                messages.push({ role, content, sources, timestamp: time });
                return msgDiv;
            }

            // ─── THINKING INDICATOR ────────────────────────────────────
            let thinkingEl = null;

            function showThinking() {
                removeThinking();
                const wrapper = document.createElement('div');
                wrapper.className = 'message assistant';
                wrapper.id = 'thinking-indicator';

                const avatar = document.createElement('div');
                avatar.className = 'msg-avatar';
                avatar.textContent = 'A';
                wrapper.appendChild(avatar);

                const contentWrap = document.createElement('div');
                contentWrap.className = 'msg-content';

                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble';
                bubble.style.background = 'var(--bg-surface)';
                bubble.style.border = '1px solid var(--border-light)';

                const inner = document.createElement('div');
                inner.className = 'thinking-wrapper';
                inner.innerHTML = `
                        <span class="thinking-text">Thinking</span>
                        <span class="dots">
                            <span></span><span></span><span></span>
                        </span>
                    `;
                bubble.appendChild(inner);
                contentWrap.appendChild(bubble);
                wrapper.appendChild(contentWrap);
                messageContainer.appendChild(wrapper);
                messageContainer.scrollTop = messageContainer.scrollHeight;
                thinkingEl = wrapper;
            }

            function removeThinking() {
                if (thinkingEl) {
                    thinkingEl.remove();
                    thinkingEl = null;
                }
                const el = document.getElementById('thinking-indicator');
                if (el) el.remove();
            }

            // ─── API CALLS ─────────────────────────────────────────────
            async function fetchFiles() {
                try {
                    const res = await fetch(`${BACKEND}/files`);
                    if (!res.ok) throw new Error('Failed to fetch files');
                    const data = await res.json();
                    return data.files || [];
                } catch (e) {
                    console.warn('File list error:', e);
                    return [];
                }
            }

            async function uploadFiles(files) {
                const formData = new FormData();
                for (const f of files) formData.append('file', f);
                const res = await fetch(`${BACKEND}/ingest/file`, {
                    method: 'POST',
                    body: formData
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err || 'Upload failed');
                }
                return await res.json();
            }

            async function deleteFile(filename) {
                const res = await fetch(`${BACKEND}/files/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err || 'Delete failed');
                }
                return await res.json();
            }

            async function sendQuery(question, history) {
                const payload = {
                    question,
                    session_id: sessionId,
                    top_k: 6,
                    history: history.slice(-10)
                };
                const res = await fetch(`${BACKEND}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err || 'Query failed');
                }
                return await res.json();
            }

            async function checkSystem() {
                const res = await fetch(`${BACKEND}/stats`);
                if (!res.ok) throw new Error('System unreachable');
                return await res.json();
            }

            // ─── UI UPDATES ────────────────────────────────────────────
            async function refreshFileList() {
                try {
                    const files = await fetchFiles();
                    if (!files || files.length === 0) {
                        fileListDiv.innerHTML =
                            `<div class="file-empty"><i class="fas fa-inbox"></i> No documents yet</div>`;
                        return;
                    }
                    let html = '';
                    files.forEach(f => {
                        const ext = f.split('.').pop().toLowerCase();
                        let icon = 'fa-file';
                        if (ext === 'pdf') icon = 'fa-file-pdf';
                        else if (ext === 'docx') icon = 'fa-file-word';
                        else if (ext === 'csv') icon = 'fa-file-csv';
                        else if (ext === 'md') icon = 'fa-file-alt';
                        html += `
                                <div class="file-item" data-file="${f}">
                                    <span class="icon"><i class="fas ${icon}"></i></span>
                                    <span class="name">${f}</span>
                                    <span class="status"><i class="fas fa-check-circle"></i></span>
                                    <button class="delete-file" data-file="${f}" title="Delete file">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            `;
                    });
                    fileListDiv.innerHTML = html;

                    // Delete handlers
                    fileListDiv.querySelectorAll('.delete-file').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const filename = btn.dataset.file;
                            if (!confirm(`Delete "${filename}"?`)) return;
                            try {
                                await deleteFile(filename);
                                showToast(`Deleted "${filename}"`, 'success');
                                await refreshFileList();
                            } catch (err) {
                                showToast('Delete failed: ' + err.message, 'error');
                            }
                        });
                    });
                } catch (e) {
                    fileListDiv.innerHTML = `<div class="file-empty"><i class="fas fa-exclamation-triangle"></i> Error loading files</div>`;
                }
            }

            async function updateStats() {
                try {
                    const data = await checkSystem();
                    const chunks = data.vector_store?.total_chunks || 0;
                    chunkCountSpan.textContent = chunks + ' chunks';
                } catch (_) {
                    chunkCountSpan.textContent = '—';
                }
            }

            // ─── HANDLERS ──────────────────────────────────────────────

            // Send message
            async function handleSend() {
                const text = userInput.value.trim();
                if (!text || isProcessing) return;

                userInput.value = '';
                isProcessing = true;
                sendBtn.disabled = true;
                userInput.disabled = true;
                autoResizeTextarea();

                addMessage('user', text);
                showThinking();

                try {
                    const history = messages
                        .filter(m => m.role !== 'system')
                        .slice(0, -1)
                        .map(m => ({ role: m.role, content: m.content }));

                    const result = await sendQuery(text, history);
                    removeThinking();
                    addMessage('assistant', result.answer, result.sources || []);
                } catch (err) {
                    removeThinking();
                    addMessage('assistant', '❌ **Error:** ' + err.message);
                    showToast('Failed to get response', 'error');
                } finally {
                    isProcessing = false;
                    sendBtn.disabled = false;
                    userInput.disabled = false;
                    userInput.focus();
                    autoResizeTextarea();
                }
            }

            // Upload files
            async function handleUpload() {
                const files = fileInput.files;
                if (!files || files.length === 0) {
                    showToast('Please select one or more files.', 'info');
                    return;
                }

                uploadBtn.disabled = true;
                uploadBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Indexing...';

                try {
                    const result = await uploadFiles(files);
                    showToast(`Indexed ${files.length} file(s) successfully!`, 'success');
                    fileInput.value = '';
                    selectedFiles = [];
                    updateFileCount();
                    await refreshFileList();
                    await updateStats();
                } catch (err) {
                    showToast('Upload failed: ' + err.message, 'error');
                } finally {
                    uploadBtn.disabled = false;
                    uploadBtn.innerHTML = '<i class="fas fa-upload"></i> Index';
                }
            }

            // Check system
            async function handleCheckSystem() {
                try {
                    const data = await checkSystem();
                    const chunks = data.vector_store?.total_chunks || 0;
                    showToast(`✅ System online · ${chunks} chunks indexed`, 'success');
                    chunkCountSpan.textContent = chunks + ' chunks';
                } catch (err) {
                    showToast('❌ Cannot connect to backend.', 'error');
                }
            }

            // New chat
            function handleNewChat() {
                messageContainer.innerHTML = '';
                messages = [];
                addMessage('assistant', 'Hello! I\'m **Mr Avayo**, your knowledge assistant. Ask me anything about your documents.');
                closeSidebar();
                userInput.focus();
            }

            // Clear chat (just clears messages, keeps session)
            function handleClearChat() {
                if (messages.length <= 1) return;
                if (!confirm('Clear all messages?')) return;
                messageContainer.innerHTML = '';
                messages = [];
                addMessage('assistant', 'Chat cleared. How can I help you?');
            }

            // ─── FILE INPUT HANDLING ──────────────────────────────────
            function updateFileCount() {
                const count = fileInput.files.length;
                fileCount.textContent = count;
                if (count > 0) {
                    const names = Array.from(fileInput.files).map(f => f.name).join(', ');
                    fileInputLabel.querySelector('span:not(.file-count)').textContent =
                        count > 1 ? `${count} files selected` : names;
                } else {
                    fileInputLabel.querySelector('span:not(.file-count)').textContent = 'Choose files';
                }
            }

            fileInput.addEventListener('change', updateFileCount);

            // ─── TEXTAREA AUTO-RESIZE ──────────────────────────────────
            function autoResizeTextarea() {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
            }

            userInput.addEventListener('input', autoResizeTextarea);

            // ─── KEYBOARD SHORTCUTS ────────────────────────────────────
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            // ─── INIT ──────────────────────────────────────────────────
            async function init() {
                // Welcome message
                addMessage('assistant', 'Hello! I\'m **Mr Avayo**, your knowledge assistant. Ask me anything about your documents.');

                // Load data
                await refreshFileList();
                await updateStats();

                // Event listeners
                sendBtn.addEventListener('click', handleSend);
                uploadBtn.addEventListener('click', handleUpload);
                checkSystemBtn.addEventListener('click', handleCheckSystem);
                newChatBtn.addEventListener('click', handleNewChat);
                clearChatBtn.addEventListener('click', handleClearChat);

                // Auto-refresh file list every 30s
                setInterval(refreshFileList, 30000);
                setInterval(updateStats, 60000);

                // Focus input
                userInput.focus();
            }

            init();

            // ─── CLOSE SIDEBAR ON RESIZE TO DESKTOP ──────────────────
            const mediaQuery = window.matchMedia('(min-width: 821px)');
            mediaQuery.addEventListener('change', (e) => {
                if (e.matches) {
                    closeSidebar();
                }
            });

            // ─── DRAG & DROP FOR FILE INPUT ────────────────────────────
            const uploadArea = document.querySelector('.upload-area');
            const fileInputWrapper = document.querySelector('.file-input-wrapper');

            let dragCounter = 0;
            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => e.preventDefault());

            fileInputWrapper.addEventListener('dragenter', (e) => {
                e.preventDefault();
                dragCounter++;
                fileInputWrapper.style.borderColor = 'var(--accent)';
                fileInputWrapper.style.background = 'var(--bg-surface-3)';
            });

            fileInputWrapper.addEventListener('dragover', (e) => {
                e.preventDefault();
                fileInputWrapper.style.borderColor = 'var(--accent)';
                fileInputWrapper.style.background = 'var(--bg-surface-3)';
            });

            fileInputWrapper.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dragCounter--;
                if (dragCounter === 0) {
                    fileInputWrapper.style.borderColor = '';
                    fileInputWrapper.style.background = '';
                }
            });

            fileInputWrapper.addEventListener('drop', (e) => {
                e.preventDefault();
                dragCounter = 0;
                fileInputWrapper.style.borderColor = '';
                fileInputWrapper.style.background = '';
                const dt = e.dataTransfer;
                if (dt.files && dt.files.length) {
                    fileInput.files = dt.files;
                    updateFileCount();
                    showToast(`${dt.files.length} file(s) dropped`, 'info');
                }
            });

            console.log('🚀 Mr Avayo frontend initialized');
            console.log(`📡 Backend: ${BACKEND}`);
            console.log(`🔑 Session: ${sessionId}`);

        })();
    </script>

</body>
</html>
