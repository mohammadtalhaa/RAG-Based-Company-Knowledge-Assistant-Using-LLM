<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr Avayo – AI Assistant</title>

    <!-- Markdown & code highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* ─── CSS Variables (Dark Gemini Theme) ────────────────────── */
        :root {
            --bg-sidebar: #1e1e1e;
            --bg-main: #121212;
            --bg-bubble-assistant: #2a2a2a;
            --bg-bubble-user: #c62828;
            --text-primary: #f0f0f0;
            --text-secondary: #aaa;
            --border-light: #3a3a3a;
            --accent: #c62828;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --transition: 0.2s ease;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* ─── Reset & Base ─────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg-main);
            height: 100vh;
            display: flex;
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ─── Sidebar (Gemini style) ───────────────────────────────── */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1.2rem;
            flex-shrink: 0;
            overflow-y: auto;
            height: 100vh;
            border-right: 1px solid var(--border-light);
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.8rem;
        }
        .sidebar-header .logo {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--accent);
        }
        .sidebar-header .logo span {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-secondary);
            background: #2a2a2a;
            padding: 0.1rem 0.6rem;
            border-radius: var(--radius-sm);
            margin-left: 0.3rem;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #2a2a2a;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            border-radius: var(--radius-lg);
            padding: 0.6rem 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            width: 100%;
            margin-bottom: 1.5rem;
        }
        .new-chat-btn:hover {
            background: #3a3a3a;
            border-color: var(--accent);
        }

        .file-list-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            font-weight: 600;
            margin: 0.5rem 0 0.8rem 0;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-primary);
            transition: background 0.1s;
        }
        .file-item:hover {
            background: #2a2a2a;
        }
        .file-item .icon { font-size: 1.1rem; }
        .file-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item .status {
            font-size: 0.7rem;
            color: #4caf50;
        }

        .sidebar-divider {
            border-top: 1px solid var(--border-light);
            margin: 1.2rem 0;
        }

        .upload-area input[type="file"] {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            width: 100%;
            color: var(--text-secondary);
            background: transparent;
            border: 1px dashed var(--border-light);
            padding: 0.5rem;
            border-radius: 6px;
        }
        .upload-area button,
        .btn-secondary {
            background: #2a2a2a;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            border-radius: var(--radius-lg);
            padding: 0.5rem 1.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            width: 100%;
            margin-top: 0.4rem;
        }
        .upload-area button:hover,
        .btn-secondary:hover {
            background: #3a3a3a;
            border-color: var(--accent);
        }
        .upload-area button:disabled,
        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .sidebar-footer {
            margin-top: auto;
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
        }

        /* ─── Main Chat Area ───────────────────────────────────────── */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 1rem 1rem 1rem;
            height: 100vh;
            overflow: hidden;
        }
        .chat-header {
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-header-title {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        .chat-header-title small {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-secondary);
            background: #2a2a2a;
            padding: 0.1rem 0.6rem;
            border-radius: var(--radius-sm);
        }
        .chat-header-session {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: #2a2a2a;
            padding: 0.2rem 1rem;
            border-radius: 20px;
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .message {
            display: flex;
            animation: fadeIn 0.4s ease;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.assistant {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 80%;
            padding: 0.8rem 1.2rem;
            border-radius: var(--radius-md);
            line-height: 1.6;
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
            word-wrap: break-word;
        }
        .message.user .bubble {
            background: var(--bg-bubble-user);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .bubble {
            background: var(--bg-bubble-assistant);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }
        .bubble .sources {
            margin-top: 0.6rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .bubble .source-badge {
            background: #3a3a3a;
            border-radius: var(--radius-sm);
            padding: 0.1rem 0.8rem;
            font-size: 0.7rem;
            color: #ccc;
            border: 1px solid #555;
            display: inline-block;
        }

        /* Thinking */
        .thinking {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.2rem;
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        .thinking .dots {
            display: flex;
            gap: 0.2rem;
        }
        .thinking .dots span {
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            animation: dotPulse 1.2s infinite ease-in-out;
        }
        .thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input */
        .input-area {
            padding: 0.8rem 0;
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
            display: flex;
            gap: 0.5rem;
        }
        .input-area input {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            outline: none;
            background: #1e1e1e;
            color: var(--text-primary);
            transition: border var(--transition), box-shadow var(--transition);
        }
        .input-area input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(198,40,40,0.2);
        }
        .input-area input::placeholder {
            color: var(--text-secondary);
        }
        .input-area button {
            padding: 0.8rem 2rem;
            background: var(--accent);
            border: none;
            color: #fff;
            border-radius: var(--radius-lg);
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition);
            white-space: nowrap;
        }
        .input-area button:hover {
            background: #b71c1c;
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Scrollbar */
        .messages::-webkit-scrollbar {
            width: 6px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        /* Markdown */
        .bubble pre {
            background: #1e1e1e;
            border-radius: 6px;
            padding: 0.8rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .bubble code {
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            font-size: 0.9em;
            background: #2a2a2a;
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
        }
        .bubble pre code {
            background: transparent;
            padding: 0;
        }
        .bubble ul, .bubble ol {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }
        .bubble p {
            margin: 0.5rem 0;
        }
        .bubble p:first-child { margin-top: 0; }
        .bubble p:last-child { margin-bottom: 0; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 720px) {
            .sidebar { width: 220px; padding: 1rem; }
            .chat-container { padding: 0 0.5rem 0.5rem 0.5rem; }
            .bubble { max-width: 90%; }
        }
        @media (max-width: 540px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 40vh;
                border-right: none;
                border-bottom: 1px solid var(--border-light);
                flex-shrink: 1;
            }
            .chat-container { height: 60vh; max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ─── SIDEBAR ──────────────────────────────────────────── -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">🔴 Mr Avayo <span>BETA</span></div>
        </div>

        <button class="new-chat-btn" id="newChatBtn">➕ New Chat</button>

        <div class="file-list-label">📂 Knowledge Base</div>
        <div id="fileList">
            <p style="color:#888; font-size:0.85rem;">Loading...</p>
        </div>

        <div class="sidebar-divider"></div>

        <div class="upload-area">
            <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,.csv" />
            <button id="uploadBtn">Process & Index</button>
        </div>

        <button class="btn-secondary" id="checkSystemBtn">🔍 Check system</button>

        <div class="sidebar-footer">⚡ RAG · Gemini · 🔴</div>
    </div>

    <!-- ─── MAIN CHAT ──────────────────────────────────────────── -->
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-header-title">
                Mr Avayo <small>BETA</small>
            </div>
            <div class="chat-header-session" id="sessionId">Session: ...</div>
        </div>

        <div class="messages" id="messageContainer">
            <!-- Messages injected here -->
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask a question..." />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        (function() {
            // ─── POINT TO YOUR HUGGING FACE BACKEND ──────────────────
            const BACKEND = 'https://mohammadtalhaa-fvltesting.hf.space';

            // DOM refs
            const messageContainer = document.getElementById('messageContainer');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const fileListDiv = document.getElementById('fileList');
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const checkSystemBtn = document.getElementById('checkSystemBtn');
            const newChatBtn = document.getElementById('newChatBtn');
            const sessionIdSpan = document.getElementById('sessionId');

            let sessionId = crypto.randomUUID ? crypto.randomUUID() : 'session-' + Date.now();
            sessionIdSpan.textContent = 'Session: ' + sessionId.slice(0,8);
            let messages = [];

            // ─── Helpers ────────────────────────────────────────────
            function renderMarkdown(text) {
                return marked.parse(text, {
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    }
                });
            }

            function addMessage(role, content, sources = []) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${role}`;
                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                if (role === 'assistant') {
                    bubble.innerHTML = renderMarkdown(content);
                    if (sources && sources.length) {
                        const srcDiv = document.createElement('div');
                        srcDiv.className = 'sources';
                        sources.forEach(src => {
                            const badge = document.createElement('span');
                            badge.className = 'source-badge';
                            badge.textContent = '📄 ' + src;
                            srcDiv.appendChild(badge);
                        });
                        bubble.appendChild(srcDiv);
                    }
                } else {
                    bubble.textContent = content;
                }

                msgDiv.appendChild(bubble);
                messageContainer.appendChild(msgDiv);
                messageContainer.scrollTop = messageContainer.scrollHeight;
                messages.push({ role, content, sources });
            }

            function showThinking() {
                const div = document.createElement('div');
                div.className = 'message assistant';
                div.id = 'thinking-indicator';
                div.innerHTML = `
                    <div class="bubble" style="background:#2a2a2a; border:1px solid #3a3a3a;">
                        <div class="thinking">
                            <span>Thinking</span>
                            <span class="dots">
                                <span></span><span></span><span></span>
                            </span>
                        </div>
                    </div>
                `;
                messageContainer.appendChild(div);
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }

            function removeThinking() {
                const el = document.getElementById('thinking-indicator');
                if (el) el.remove();
            }

            // ─── API ──────────────────────────────────────────────────
            async function fetchFiles() {
                try {
                    const res = await fetch(`${BACKEND}/files`);
                    if (!res.ok) throw new Error('Failed to fetch files');
                    const data = await res.json();
                    return data.files || [];
                } catch (e) {
                    console.error('File list error:', e);
                    return [];
                }
            }

            async function uploadFiles(files) {
                const formData = new FormData();
                for (let f of files) formData.append('file', f);
                const res = await fetch(`${BACKEND}/ingest/file`, {
                    method: 'POST',
                    body: formData
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }
                return await res.json();
            }

            async function sendQuery(question, history) {
                const payload = {
                    question,
                    session_id: sessionId,
                    top_k: 6,
                    history: history.slice(-10)
                };
                const res = await fetch(`${BACKEND}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }
                return await res.json();
            }

            async function checkSystem() {
                const res = await fetch(`${BACKEND}/stats`);
                if (!res.ok) throw new Error('System unreachable');
                return await res.json();
            }

            // ─── UI Updates ──────────────────────────────────────────
            async function refreshFileList() {
                const files = await fetchFiles();
                if (files.length === 0) {
                    fileListDiv.innerHTML = '<p style="color:#888; font-size:0.85rem;">No documents uploaded yet.</p>';
                    return;
                }
                let html = '';
                files.forEach(f => {
                    const ext = f.split('.').pop().toLowerCase();
                    let icon = '📄';
                    if (ext === 'pdf') icon = '📑';
                    else if (ext === 'docx') icon = '📘';
                    else if (ext === 'csv') icon = '📊';
                    html += `<div class="file-item"><span class="icon">${icon}</span><span class="name">${f}</span><span class="status">✅</span></div>`;
                });
                fileListDiv.innerHTML = html;
            }

            // ─── Event handlers ──────────────────────────────────────
            async function handleSend() {
                const text = userInput.value.trim();
                if (!text) return;
                userInput.value = '';
                userInput.disabled = true;
                sendBtn.disabled = true;

                addMessage('user', text);
                showThinking();

                try {
                    const history = messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
                    const result = await sendQuery(text, history);
                    removeThinking();
                    addMessage('assistant', result.answer, result.sources || []);
                } catch (err) {
                    removeThinking();
                    addMessage('assistant', '❌ Error: ' + err.message);
                } finally {
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                }
            }

            async function handleUpload() {
                const files = fileInput.files;
                if (!files || files.length === 0) {
                    alert('Please select one or more files.');
                    return;
                }
                uploadBtn.disabled = true;
                uploadBtn.textContent = 'Uploading...';
                try {
                    await uploadFiles(files);
                    alert('Files uploaded and indexed successfully!');
                    await refreshFileList();
                } catch (err) {
                    alert('Upload failed: ' + err.message);
                } finally {
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'Process & Index';
                    fileInput.value = '';
                }
            }

            async function handleCheckSystem() {
                try {
                    const data = await checkSystem();
                    const chunks = data.vector_store?.total_chunks || 0;
                    alert(`✅ System online\n${chunks} chunks indexed`);
                } catch (err) {
                    alert('❌ Cannot connect to backend.');
                }
            }

            function handleNewChat() {
                messageContainer.innerHTML = '';
                messages = [];
                addMessage('assistant', 'Hello! I\'m **Mr Avayo**, your company knowledge assistant. How can I help you today?');
            }

            // ─── Init ──────────────────────────────────────────────
            async function init() {
                addMessage('assistant', 'Hello! I\'m **Mr Avayo**, your company knowledge assistant. How can I help you today?');
                await refreshFileList();

                sendBtn.addEventListener('click', handleSend);
                userInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') handleSend();
                });
                uploadBtn.addEventListener('click', handleUpload);
                checkSystemBtn.addEventListener('click', handleCheckSystem);
                newChatBtn.addEventListener('click', handleNewChat);

                setInterval(refreshFileList, 30000);
            }

            init();
        })();
    </script>
</body>
</html>
